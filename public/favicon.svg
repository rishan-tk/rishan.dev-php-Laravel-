<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Solid black background  no transparency -->
  <rect width="100" height="100" fill="#0d1117"/>
  <!--
    R built from filled rectangles mimicking the ˆˆˆˆˆˆW block character style.
    Shadow/depth layer offset 3px down-right in darker green, then bright layer on top.

    R anatomy:
      - Left vertical stem
      - Top horizontal bar
      - Middle horizontal bar
      - Bump (top-right arc of R, rendered as a rectangle)
      - Leg (bottom-right diagonal of R)
  -->

  <!-- Shadow layer (#166534 dark green, offset +3,+3) -->
  <!-- Left stem shadow -->
  <rect x="21" y="18" width="12" height="64" fill="#166534"/>
  <!-- Top bar shadow -->
  <rect x="21" y="18" width="46" height="12" fill="#166534"/>
  <!-- Bump top-right shadow -->
  <rect x="55" y="18" width="12" height="10" fill="#166534"/>
  <!-- Bump right side shadow -->
  <rect x="55" y="18" width="12" height="30" fill="#166534"/>
  <!-- Middle bar shadow -->
  <rect x="21" y="45" width="46" height="10" fill="#166534"/>
  <!-- Bump bottom-right corner shadow -->
  <rect x="55" y="45" width="12" height="10" fill="#166534"/>
  <!-- Leg shadow (diagonal from mid-right down to bottom-right) -->
  <rect x="46" y="52" width="14" height="10" fill="#166534"/>
  <rect x="54" y="59" width="14" height="10" fill="#166534"/>
  <rect x="60" y="67" width="14" height="12" fill="#166534"/>

  <!-- Bright layer (#4ade80 neon green, offset -3,-3 from shadow) -->
  <!-- Left stem -->
  <rect x="18" y="15" width="12" height="64" fill="#4ade80"/>
  <!-- Top bar -->
  <rect x="18" y="15" width="46" height="12" fill="#4ade80"/>
  <!-- Bump top-right -->
  <rect x="52" y="15" width="12" height="10" fill="#4ade80"/>
  <!-- Bump right side -->
  <rect x="52" y="15" width="12" height="30" fill="#4ade80"/>
  <!-- Middle bar -->
  <rect x="18" y="42" width="46" height="10" fill="#4ade80"/>
  <!-- Bump bottom-right corner -->
  <rect x="52" y="42" width="12" height="10" fill="#4ade80"/>
  <!-- Leg -->
  <rect x="43" y="49" width="14" height="10" fill="#4ade80"/>
  <rect x="51" y="56" width="14" height="10" fill="#4ade80"/>
  <rect x="57" y="64" width="14" height="12" fill="#4ade80"/>

  <!-- Black cutout for the inner hole of the R bump -->
  <rect x="30" y="27" width="22" height="14" fill="#0d1117"/>
</svg>
