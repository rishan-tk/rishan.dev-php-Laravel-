      Col:    0 1 2 3 4 5 6 7
      Row  0: # # # # # # # #   top bar
      Row  1: # # # # # # # #
      Row  2: # # . . . . # #   bump sides + hole
      Row  3: # # . . . . # #
      Row  4: # # . . . . # #
      Row  5: # # # # # # # #   middle bar
      Row  6: # # # # # # # #
      Row  7: # # # # # # . .   leg: col 4-5 break right
      Row  8: # # . . # # # .
      Row  9: # # . . . # # #
      Row 10: # # . . . . # #
      Row 11: # # . . . . # #
      Row 12: # # . . . . # #

