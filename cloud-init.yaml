#cloud-config
# Cloud-init for rishan.dev -- Hosteons Ubuntu 24.04
# Paste this into the "User Data" / "Cloud Config" field when creating the VPS.
# BEFORE PASTING: Replace YOUR_SSH_PUBLIC_KEY_HERE with your personal SSH public key.

package_upgrade: true

users:
  - name: deploy
    sudo: ALL=(ALL) NOPASSWD:/usr/sbin/service php8.3-fpm restart,/usr/sbin/service nginx restart
    groups: sudo,www-data
    shell: /bin/bash
    ssh_authorized_keys:
     

runcmd:
  # --- 1. System packages ---------------------------------------------------
  - apt-get update
  - apt-get install -y software-properties-common curl git unzip acl

  # --- 2. PHP 8.3 from Ondrej PPA ------------------------------------------
  - add-apt-repository -y ppa:ondrej/php
  - apt-get update
  - apt-get install -y php8.3-fpm php8.3-cli php8.3-mbstring php8.3-xml php8.3-curl php8.3-sqlite3 php8.3-zip

  # --- 3. Nginx -------------------------------------------------------------
  - apt-get install -y nginx

  # --- 4. Node.js 20 LTS from NodeSource -----------------------------------
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs

  # --- 5. Composer -----------------------------------------------------------
  - php -r "copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');"
  - php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
  - chmod +x /usr/local/bin/composer
  - rm /tmp/composer-setup.php

  # --- 6. Certbot for SSL ---------------------------------------------------
  - apt-get install -y certbot python3-certbot-nginx

  # --- 7. Deployer directory structure --------------------------------------
  - mkdir -p /var/www/laravel/shared/database
  - mkdir -p /var/www/laravel/shared/storage/app/public
  - mkdir -p /var/www/laravel/shared/storage/framework/cache/data
  - mkdir -p /var/www/laravel/shared/storage/framework/sessions
  - mkdir -p /var/www/laravel/shared/storage/framework/views
  - mkdir -p /var/www/laravel/shared/storage/logs
  - touch /var/www/laravel/shared/database/database.sqlite
  - chown -R deploy:www-data /var/www/laravel
  - chmod -R 775 /var/www/laravel/shared/storage
  - chmod -R 775 /var/www/laravel/shared/database
  - setfacl -Rdm g:www-data:rwx /var/www/laravel/shared/storage
  - setfacl -Rdm g:www-data:rwx /var/www/laravel/shared/database

  # --- 8. Placeholder .env (fill in real values after first boot) -----------
  - |
    cat <<'EOF' > /var/www/laravel/shared/.env
    APP_NAME="Rishan Dev"
    APP_ENV=production
    APP_KEY=
    APP_DEBUG=false
    APP_URL=https://rishan.dev
    LOG_CHANNEL=stack
    LOG_LEVEL=error
    DB_CONNECTION=sqlite
    SESSION_DRIVER=database
    SESSION_ENCRYPT=true
    SESSION_SECURE_COOKIE=true
    SESSION_DOMAIN=rishan.dev
    CACHE_STORE=database
    QUEUE_CONNECTION=database
    EOF
  - chown deploy:www-data /var/www/laravel/shared/.env
  - chmod 640 /var/www/laravel/shared/.env

  # --- 9. Nginx config (Deployer symlink structure) -------------------------
  - rm -f /etc/nginx/sites-enabled/default
  - |
    cat <<'NGINX' > /etc/nginx/sites-available/laravel
    server {
        listen 80;
        server_name rishan.dev;

        root /var/www/laravel/current/public;
        index index.php;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
    NGINX
  - ln -sf /etc/nginx/sites-available/laravel /etc/nginx/sites-enabled/laravel
  - nginx -t
  - systemctl restart nginx
  - systemctl restart php8.3-fpm

  # --- 10. SSL via Certbot (will fail until DNS points here) ----------------
  # Uncomment the next line AFTER Cloudflare A record points to this server:
  # - certbot --nginx --agree-tos --redirect -m rishan-tk@rishan.dev -d rishan.dev --non-interactive
